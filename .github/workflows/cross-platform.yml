name: Cross-platform acceptance

on:
  push:
    branches-ignore: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Keep temporary files in the runner workspace
        shell: bash
        run: printf 'TMPDIR=%s\nGOTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test SSH, SFTP, terminal and forwarding
        run: go test ./... -race -count=1 -timeout=180s
      - name: Verify terminal cancellation repeatedly
        if: runner.os == 'Windows'
        run: go test ./pkg/sshlib -run '^TestTerminalInteractive$' -race -count=5 -timeout=120s
      - name: Build CLI
        run: go build -o data/sshdev.exe ./cmd/sshdev
      - name: Test CLI configuration and diagnostics
        shell: bash
        run: SSHDEV_TEST_BINARY="$PWD/data/sshdev.exe" go test ./cmd/sshdev -run 'TestCLIConfigFile|TestDoctorInvalidConfig' -v -count=1
      - name: Test Linux service installation and automatic recovery
        if: runner.os == 'Linux'
        shell: bash
        run: sudo env PATH="$PATH" TMPDIR="$RUNNER_TEMP" GOTMPDIR="$RUNNER_TEMP" SSHDEV_SERVICE_TEST=1 SSHDEV_TEST_BINARY="$PWD/data/sshdev.exe" GOCACHE="$HOME/.cache/go-build" GOMODCACHE="$(go env GOMODCACHE)" go test ./cmd/sshdev -run '^TestServiceLifecycle$' -v -count=1 -timeout=240s
      - name: Test Windows service installation and automatic recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SSHDEV_SERVICE_TEST = '1'
          $env:SSHDEV_TEST_BINARY = "$pwd/data/sshdev.exe"
          go test ./cmd/sshdev -run '^TestServiceLifecycle$' -v -count=1 -timeout=240s
